name: Validate
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libdbus-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features desktop --locked -- -D warnings
      - run: cargo test --workspace --features desktop --locked
      - run: cargo run -- --lang self --format json
      - run: cargo run -- check
      - run: cargo run -- build
      - run: cargo run -- get Compiler
      - run: cargo run -- export
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install Android requirements
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: npm ci && npm run build
        working-directory: ui
      - run: cargo run -p luvyn --locked -- ide build --android
      - uses: actions/upload-artifact@v4
        with:
          name: luvyn-android-debug
          path: dist/android/luvyn-debug.apk

