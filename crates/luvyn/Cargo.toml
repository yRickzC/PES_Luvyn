[package]
name = "luvyn"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
luvyn-core = { path = "../luvyn-core" }
luvyn-drive = { path = "../luvyn-drive" }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
notify = "8"
rust-embed = "8"
mime_guess = "2"
webbrowser = "1"
rand = "0.9"
ignore = "0.4"
fs2 = "0.4"
ureq = { version = "3", default-features = false, features = ["json"] }
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }

[features]
default = []
desktop = ["dep:tao", "dep:wry"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

