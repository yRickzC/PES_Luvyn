[workspace]
members = ["crates/luvyn-core", "crates/luvyn"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
postcard = { version = "1", features = ["alloc"] }

[profile.release]
lto = "thin"
strip = true

